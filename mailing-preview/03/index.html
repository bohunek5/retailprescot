<body>
  <main class="gate">
    <header><img src="gate-logo.svg" alt="PRESCOT LED" class="wordmark"><span>RETAIL</span></header>
    <section class="gate-content">
      <p class="eyebrow">RETAILSHOW / MAILING 03</p>
      <h1>Podgląd<br>mailingu.</h1>
      <p class="intro">Wpisz hasło, aby zobaczyć tę propozycję.</p>

        <label for="preview-password">Hasło do podglądu</label>
        <div class="password-field"><input id="preview-password" name="password" type="password" autocomplete="current-password" required minlength="6" aria-describedby="unlock-status"><button type="button" class="reveal" aria-label="Pokaż hasło" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
        <button type="submit" class="unlock"><span>Otwórz podgląd</span><svg viewBox="0 0 28 20" aria-hidden="true"><path d="M2 10h23m-7-7 7 7-7 7"/></svg></button>
        <p id="unlock-status" role="status" aria-live="polite"></p>
      </form>
    </section>
    <footer>Kompletne systemy LED<span>PRESCOT Retail</span></footer>
  </main>
  <aside class="light-study" aria-hidden="true"><div class="light-line"></div><div class="light-line second"></div><div class="study-caption">Światło.<br>Produkt. Ekspozycja.</div></aside>
